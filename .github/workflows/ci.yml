name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

# A newer push cancels a pull request's run, but every main run finishes:
# a release requires a complete CI run for its exact commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Matches `nightly_toolchain` in the justfile: rustfmt.toml uses unstable options.
  NIGHTLY: nightly-2026-06-20

jobs:
  # Audits the workflows themselves: template injection, over-broad
  # permissions, unpinned actions, persisted credentials, cache poisoning.
  zizmor:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          online-audits: false

  format:
    name: Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly rustfmt
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: taplo
      - name: Check Rust formatting
        run: cargo "+$NIGHTLY" fmt --all -- --check
      - name: Check TOML formatting
        run: taplo fmt --check

  build:
    name: Build, lint and test
    # The window is tried here on macOS; package.yml builds and checks the
    # Linux and Windows packages.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the lockfile is current
        run: cargo fetch --locked
      - name: Clippy (all targets)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Load the app headlessly (demo archive)
        run: MSGVAULT_DEMO=1 cargo run --locked -- --check
